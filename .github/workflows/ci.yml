name: CI - Verificación, e2e y seguridad

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # --frozen-lockfile: el lockfile versionado es la única fuente; las políticas de
      # pnpm-workspace.yaml (antigüedad mínima, procedencia) se vuelven a aplicar aquí.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato, lint, tests con cobertura y build
        run: pnpm verify

      - name: Dependencias de producción sin vulnerabilidades altas o críticas
        run: pnpm audit:prod

  e2e:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Instalar dependencias y Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # Se prueba la imagen real: nginx con la CSP estricta y Trusted Types.
      - name: Construir y levantar la imagen de producción
        run: |
          docker build -f Containerfile -t repuestos-front:ci .
          docker run -d -p 127.0.0.1:18090:8080 repuestos-front:ci
          timeout 30 sh -c 'until wget -q -O /dev/null http://127.0.0.1:18090/; do sleep 1; done'

      - name: Pruebas e2e
        run: pnpm e2e

      - name: Publicar reporte
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  analisis-seguridad:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy - configuración (Containerfile) y dependencias del lockfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '0'
