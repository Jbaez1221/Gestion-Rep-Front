<div class="flex min-h-screen flex-col md:flex-row">
  <aside class="border-b border-slate-200 bg-white md:w-60 md:shrink-0 md:border-r md:border-b-0">
    <div class="flex items-center justify-between px-4 py-3">
      <a routerLink="/inicio" class="text-lg font-semibold text-marca-700">Repuestos</a>
      <button
        type="button"
        class="btn-secundario md:hidden"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-principal"
        (click)="menuAbierto.set(!menuAbierto())"
      >
        Menú
      </button>
    </div>
    <nav
      id="menu-principal"
      aria-label="Menú principal"
      class="px-2 pb-3 md:block"
      [class.hidden]="!menuAbierto()"
    >
      <ul class="space-y-1">
        @for (item of menu(); track item.ruta) {
          <li>
            <a
              [routerLink]="item.ruta"
              routerLinkActive="bg-marca-50 text-marca-700"
              ariaCurrentWhenActive="page"
              class="block rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
              (click)="menuAbierto.set(false)"
            >
              {{ item.texto }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="flex flex-wrap items-center justify-end gap-3 border-b border-slate-200 bg-white px-4 py-2"
    >
      @if (sesion.sucursales().length > 0 || sesion.perfil()?.todasLasSucursales) {
        <label class="flex items-center gap-2 text-sm text-slate-600">
          Sucursal
          <select class="campo w-auto py-1" (change)="elegirSucursal($event)">
            @if (sesion.perfil()?.todasLasSucursales) {
              <option value="" [selected]="!sesion.sucursalActiva()">Todas</option>
            }
            @for (s of sesion.sucursales(); track s.id) {
              <option [value]="s.id" [selected]="sesion.sucursalActiva()?.id === s.id">
                {{ s.codigo }} · {{ s.nombre }}
              </option>
            }
          </select>
        </label>
      }
      @if (sesion.perfil(); as p) {
        <span class="text-sm text-slate-700">
          {{ p.nombres }} {{ p.apellidos }} <span class="insignia-neutra">{{ p.rol }}</span>
        </span>
      }
      <button type="button" class="btn-secundario" (click)="salir()">Cerrar sesión</button>
    </header>
    <div class="p-4 sm:p-6">
      <router-outlet />
    </div>
  </div>
</div>
