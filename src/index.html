<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Repuestos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sistema de ventas: inventario, compras, ventas y sucursales."

  </body>
