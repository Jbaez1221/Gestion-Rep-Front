# Hooks de git (se instalan con `pnpm install`, script "prepare").
pre-commit:
  parallel: true
  jobs:
    - name: formato
      glob: '*.{ts,html,css,json,js,mjs,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
    - name: lint
      glob: '*.{ts,html}'
      run: pnpm exec eslint {staged_files}

commit-msg:
  jobs:
    - name: conventional-commits
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: tests
      run: pnpm test
