# Sirve solo el front compilado. El proxy inverso del hosting (con HTTPS) envía /api/ al backend y
# todo lo demás aquí: front y API quedan en el mismo origen y las cookies de sesión no cruzan dominios.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location ~ /\. {
        deny all;
    }

    # La API la atiende el backend vía el proxy inverso: si una petición llega aquí, es un error de
    # enrutamiento y no debe responderse con el HTML de la app.
    location /api/ {
        return 404;
    }

    # Archivos con hash en el nombre: nunca cambian, se cachean un año.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        limit_except GET {
            deny all;
        }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Todo lo demás (index.html, service worker, manifest, íconos) se revalida siempre, y las rutas de
    # la SPA caen en index.html. El nonce se escribe en el HTML de cada respuesta.
    location / {
        # Solo lectura: los archivos estáticos no aceptan otros métodos (GET incluye HEAD).
        limit_except GET {
            deny all;
        }
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}
