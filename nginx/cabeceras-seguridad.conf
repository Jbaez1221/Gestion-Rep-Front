# Cabeceras de seguridad (OWASP A05). Se incluyen en cada location: en nginx, un add_header dentro
# de un location anula los heredados del server.
#
# CSP estricta: sin 'unsafe-inline' ni 'unsafe-eval'. Los estilos que Angular inyecta en tiempo de
# ejecución llevan el nonce de la respuesta ($request_id, aleatorio en cada petición), y Trusted
# Types solo admite las políticas propias de Angular: un XSS no puede inyectar scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler default" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
